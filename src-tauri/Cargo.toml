[package]
name = "nutclient-launcher"
version = "0.9.40"
description = "NUTclient Launcher – Minecraft-Launcher auf Basis von Tauri"
authors = ["NUTclient"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nutclient_launcher_lib"
# Desktop-only: nur rlib. Fuer Android/iOS spaeter "staticlib" bzw. "cdylib"
# wieder ergaenzen (die GNU-Toolchain sprengt bei cdylib die PE-Export-Grenze).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures-util = "0.3"
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"
base64 = "0.22"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Übertragung zwischen zwei Geräten im WLAN: Schlüsseltausch + Verschlüsselung (Konten gehen mit)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
# Java für Linux/macOS kommt als .tar.gz
flate2 = "1"
tar = "0.4"

# Nur Desktop: Auto-Update, Neustart, Papierkorb (gibt es auf iPhone/Android nicht)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Eigene Dateien einer Instanz in den Papierkorb legen statt endgültig zu löschen
trash = "5"

# iPhone: Java (OpenJDK) im App-Prozess starten (ios_java.rs)
[target.'cfg(target_os = "ios")'.dependencies]
jni = "0.21"
libloading = "0.8"

# System-Medienwiedergabe (Spotify/YouTube/Netflix … über die Windows-SMTC-API)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Control",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_System_Power",
] }
